[project]
name = "once-campfire-fastapi"
version = "0.1.0"
description = "Native FastAPI implementation of ONCE Campfire"
license = "MIT"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "uvloop==0.22.1",
    "httptools==0.8.0",
    "jinja2==3.1.6",
    "cryptography==50.0.1",
    "bcrypt==5.0.0",
    "nh3==0.3.7",
    "pyvips[binary]==3.2.0",
    "pyvips-binary==8.18.6",
    "httpx==0.28.1",
    "pywebpush==2.5.0",
    "qrcode==8.2",
    "redis==8.1.0",
    "orjson==3.12.0",
    "python-multipart==0.0.32",
    "pillow==12.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pyright==1.1.414",
    "ruff==0.16.8",
    "httpx2==2.13.1",
]

[tool.uv]
package = false
# Supply-chain cooldown: resolve only releases at least two weeks old.
exclude-newer = "2026-09-24T00:00:00Z"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["reference", "assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN"]
ignore = ["E501", "RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pyright]
include = ["campfire", "tests", "tools"]
exclude = ["reference", "assets", ".venv"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
